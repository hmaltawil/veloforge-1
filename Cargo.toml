[package]
name = "veloforge"
version = "1.1.0"
edition = "2021"
description = "Smart trainer controller, workout player and training planner with a 3D ride view"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "persistence", "system_fonts", "wayland", "x11"] }
btleplug = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
roxmltree = "0.21"
directories = "6"
anyhow = "1"
ureq = "3"
qrcode = { version = "0.14", default-features = false }
getrandom = "0.3"
epaint_default_fonts = "0.37"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Audio", "Win32_UI_Shell"] }

[profile.release]
opt-level = 3

[build-dependencies]
winresource = { version = "0.1", default-features = false }
