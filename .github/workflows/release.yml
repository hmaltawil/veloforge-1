# Build the downloads and attach them to a GitHub release:
#   VeloForge-<version>-windows-x64.zip   Windows 10 and 11
#   veloforge_<version>-1_amd64.deb       Ubuntu, Debian, Linux Mint, Pop!_OS
#   VeloForge-<version>-linux-x64.tar.gz  any other Linux (./install.sh)
#   SHA256SUMS                            checksums of the three
#
# Either publish a release on GitHub (Releases > Draft a new release, with
# a new tag such as v1.2.0), or push a version tag from a computer. Either
# way the new tag starts this once, and the files are added to the release
# (made here if there is none yet) a few minutes later, once the Linux
# packages have been installed and started on fresh systems. The tag must
# match the version in Cargo.toml. A tag with a dash (v1.2.0-beta) becomes a
# pre-release.
#
# "Run workflow" (Actions > Release) on a branch builds and tests everything
# without publishing; the files are kept with that run for a few days. Run
# on a tag, it builds, tests and publishes to that tag's release, for a
# release made with a tag that already existed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Never publish to the same release from two runs at once (for example a
# tag push and a manual run on that tag).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust and the Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup toolchain install
          rustup target add x86_64-pc-windows-gnu

      - name: Build veloforge.exe
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Package the zip
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist/VeloForge
          x86_64-w64-mingw32-strip -o dist/VeloForge/veloforge.exe \
            target/x86_64-pc-windows-gnu/release/veloforge.exe
          # Windows line endings, so Notepad shows them properly everywhere.
          sed 's/$/\r/' packaging/windows/README-Windows.txt > dist/VeloForge/README-Windows.txt
          sed 's/$/\r/' LICENSE > dist/VeloForge/LICENSE.txt
          cd dist
          zip -9 -r "VeloForge-$version-windows-x64.zip" VeloForge

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    # Built on Ubuntu 22.04 (glibc 2.35), so it also runs on older systems.
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libdbus-1-dev dpkg-dev

      - uses: actions/checkout@v5

      - name: Install Rust (the version in rust-toolchain.toml) and cargo-deb
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install
          cargo install cargo-deb --locked --version 3.8.0

      - name: Build veloforge
        run: cargo build --release --locked

      - name: Package the .tar.gz and .deb
        run: packaging/linux/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  test-linux:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", package: deb }
          - { image: "debian:12", package: deb }
          - { image: "ubuntu:24.04", package: deb }
          - { image: "fedora:latest", package: tar }
    name: install ${{ matrix.package }} on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - name: Install it and start VeloForge
        run: bash packaging/linux/smoke-test.sh ${{ matrix.package }} dist

  publish:
    needs: [windows, test-linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "v$version" ]; then
            echo "::error::The tag $tag does not match the version in Cargo.toml ($version). Change one of them and publish again."
            exit 1
          fi
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          files=(dist/*)
          if gh release view "$tag" >/dev/null 2>&1; then
            # Made on GitHub: add the downloads, and the standard title and
            # notes where they were left empty.
            gh release upload "$tag" "${files[@]}" --clobber
            name="$(gh release view "$tag" --json name --jq .name)"
            body="$(gh release view "$tag" --json body --jq .body)"
            if [ -z "$name" ] || [ "$name" = "$tag" ]; then
              gh release edit "$tag" --title "VeloForge $version"
            fi
            if [ -z "$body" ]; then
              gh release edit "$tag" --notes-file packaging/release-notes.md
            fi
          else
            pre=""
            case "$tag" in *-*) pre="--prerelease" ;; esac
            gh release create "$tag" "${files[@]}" --verify-tag $pre \
              --title "VeloForge $version" \
              --notes-file packaging/release-notes.md
          fi
