# Build the Windows program and attach it, zipped, to a GitHub release.
#
# Either publish a release on GitHub (Releases > Draft a new release, with
# a new tag such as v1.0.0), or push a version tag from a computer. In both
# cases the zip and its checksum are added to the release a few minutes
# later. A tag pushed with a dash (v1.1.0-beta) becomes a pre-release.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

# Publishing a release with a new tag can start this twice (the tag and the
# release); run one after the other so they never upload at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust and the Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup toolchain install
          rustup target add x86_64-pc-windows-gnu

      - name: Build veloforge.exe
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Package the zip
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/VeloForge
          x86_64-w64-mingw32-strip -o dist/VeloForge/veloforge.exe \
            target/x86_64-pc-windows-gnu/release/veloforge.exe
          # Windows line endings, so Notepad shows them properly everywhere.
          sed 's/$/\r/' packaging/windows/README-Windows.txt > dist/VeloForge/README-Windows.txt
          sed 's/$/\r/' LICENSE > dist/VeloForge/LICENSE.txt
          cd dist
          zip -9 -r "VeloForge-$version-windows-x64.zip" VeloForge
          sha256sum "VeloForge-$version-windows-x64.zip" > "VeloForge-$version-windows-x64.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          files=("dist/VeloForge-$version-windows-x64.zip" "dist/VeloForge-$version-windows-x64.zip.sha256")
          if gh release view "$tag" >/dev/null 2>&1; then
            # Made on GitHub: add the download, and the standard title and
            # notes where they were left empty.
            gh release upload "$tag" "${files[@]}" --clobber
            name="$(gh release view "$tag" --json name --jq .name)"
            body="$(gh release view "$tag" --json body --jq .body)"
            if [ -z "$name" ] || [ "$name" = "$tag" ]; then
              gh release edit "$tag" --title "VeloForge $version"
            fi
            if [ -z "$body" ]; then
              gh release edit "$tag" --notes-file packaging/release-notes.md
            fi
          else
            pre=""
            case "$tag" in *-*) pre="--prerelease" ;; esac
            gh release create "$tag" "${files[@]}" --verify-tag $pre \
              --title "VeloForge $version" \
              --notes-file packaging/release-notes.md
          fi
