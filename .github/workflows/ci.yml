# Check every change: formatting, lints and tests on Linux, and lints, tests
# and a build on a real Windows machine (with Microsoft's compiler, the way
# someone building VeloForge on Windows would). A change that only touches
# documentation is not checked: none of these files are built into the app.
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "packaging/**/*.txt"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "packaging/**/*.txt"

permissions:
  contents: read

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Pull requests from branches of this repository are already checked
    # by their push; only forks need the pull_request run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Bluetooth (D-Bus) headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked

  windows:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Build veloforge.exe
        run: cargo build --locked
      - name: The program has its name, version and icon
        shell: pwsh
        run: |
          $info = (Get-Item target\debug\veloforge.exe).VersionInfo
          "FileDescription: $($info.FileDescription), version: $($info.FileVersion)"
          if ($info.FileDescription -ne 'VeloForge') { throw 'veloforge.exe is missing its Windows resources (name and icon)' }
